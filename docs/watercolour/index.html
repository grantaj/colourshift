<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watercolour Explorer</title>
  <meta name="description" content="Interactive Watercolour Effect stimulus explorer." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter/index.css" />
  <link rel="stylesheet" href="watercolour.css?v=7" />
</head>
<body>
  <header class="site-header">
    <h1>Watercolour Explorer</h1>
  </header>

  <main class="explorer-shell">
    <section class="preview-panel" aria-label="Stimulus preview">
      <div id="stage" class="stage">
        <svg
          id="stimulus"
          viewBox="0 0 760 760"
          preserveAspectRatio="xMidYMid meet"
          role="img"
          aria-labelledby="stimulus-title"
        >
          <title id="stimulus-title">Interactive annular watercolour-effect double-contour stimulus</title>
          <rect x="0" y="0" width="760" height="760" fill="#ffffff" />
          <path id="outer-barrier" fill="none" stroke="#3155a4" stroke-linejoin="round"></path>
          <path id="inner-barrier" fill="none" stroke="#3155a4" stroke-linejoin="round"></path>
          <path id="outer-inducing" fill="none" stroke="#6ec66a" stroke-linejoin="round"></path>
          <path id="inner-inducing" fill="none" stroke="#6ec66a" stroke-linejoin="round"></path>
          <path id="field" fill="#ffffff" fill-rule="evenodd"></path>
        </svg>
      </div>

      <section class="colour-dock" aria-label="Colour explorer">
        <div class="colour-dock-heading">
          <div class="colour-targets" role="group" aria-label="Colour to edit">
            <button id="edit-inner" class="colour-target active" type="button" aria-pressed="true">
              <span id="inner-swatch" class="target-swatch" aria-hidden="true"></span>
              Inner
            </button>
            <button id="edit-outer" class="colour-target" type="button" aria-pressed="false">
              <span id="outer-swatch" class="target-swatch" aria-hidden="true"></span>
              Outer
            </button>
          </div>
        </div>

        <div class="colour-plane-wrap">
          <svg
            id="colour-plane"
            class="colour-plane"
            viewBox="0 0 100 100"
            preserveAspectRatio="none"
            role="img"
            aria-label="OKLab chromatic colour plane"
          ></svg>
          <div id="colour-plane-marker" class="colour-plane-marker" style="left: 25.513%; top: 31.543%;" aria-hidden="true"></div>
        </div>
        <div class="colour-lightness">
          <div class="control-heading">
            <label for="colour-lightness">Lightness</label>
            <output id="colour-lightness-value" for="colour-lightness">0.75</output>
          </div>
          <input
            id="colour-lightness"
            type="range"
            min="0.2"
            max="0.9"
            step="0.005"
            value="0.7495"
          />
        </div>

        <div class="colour-presets" aria-label="Colour presets">
          <button id="preset-blue-green" class="preset-button active" type="button">Blue / green</button>
          <button id="preset-red-yellow" class="preset-button" type="button">Red / yellow</button>
        </div>
      </section>
    </section>

    <aside class="controls-panel" aria-label="Explorer controls">
      <form id="controls">
        <fieldset>
          <legend>Geometry</legend>

          <div class="control">
            <div class="control-heading">
              <label for="radius">Scale</label>
              <output id="radius-value" for="radius"></output>
            </div>
            <input id="radius" type="range" min="150" max="240" step="1" value="220" />
          </div>

          <div class="control">
            <div class="control-heading control-heading-stacked">
              <label for="shape">Shape</label>
              <output id="shape-value" for="shape"></output>
            </div>
            <input id="shape" type="range" min="0" max="1" step="0.01" value="0" />
          </div>

          <div class="control">
            <div class="control-heading">
              <label for="field-width">Field width</label>
              <output id="field-width-value" for="field-width"></output>
            </div>
            <input id="field-width" type="range" min="50" max="150" step="1" value="110" />
          </div>

          <div class="control">
            <div class="control-heading">
              <label for="ribbon-width">Ribbon width</label>
              <output id="ribbon-width-value" for="ribbon-width"></output>
            </div>
            <input id="ribbon-width" type="range" min="2" max="12" step="1" value="8" />
          </div>

          <div class="control">
            <div class="control-heading">
              <label for="amplitude">Amplitude</label>
              <output id="amplitude-value" for="amplitude"></output>
            </div>
            <input id="amplitude" type="range" min="0" max="35" step="1" value="15" />
          </div>

          <div class="control">
            <div class="control-heading control-heading-stacked">
              <label for="waves">Waves / wavelength</label>
              <output id="waves-value" for="waves"></output>
            </div>
            <input id="waves" type="range" min="2" max="30" step="1" value="12" />
          </div>

          <div class="control">
            <div class="control-heading control-heading-stacked">
              <label for="crenellation-shape">Crenellation shape</label>
              <output id="crenellation-shape-value" for="crenellation-shape"></output>
            </div>
            <input
              id="crenellation-shape"
              type="range"
              min="0.25"
              max="1.25"
              step="0.01"
              value="0.50"
            />
          </div>
        </fieldset>

        <div class="actions">
          <button id="focus-view" class="button secondary wide" type="button">Focus view</button>
          <button id="reset" class="button secondary" type="button">Reset</button>
          <button id="save-svg" class="button primary" type="button">Save SVG</button>
        </div>
      </form>
    </aside>
  </main>

  <script type="module" src="watercolour.js?v=17"></script>
</body>
</html>
