<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111111" />
  <title>ColourShift — design a colour shift</title>
  <link rel="stylesheet" href="shift/shift.css?v=9" />
</head>
<body>
  <main class="app">
    <header class="masthead">
      <h1>ColourShift</h1>
    </header>
    <p id="file-warning" class="file-warning" hidden>Chrome blocks this app when opened as a file. Start a local server, then open <code>http://localhost:8000/</code>.</p>
    <section id="results" class="results" aria-live="polite">
      <article class="comparison">
        <div class="swatches">
          <div class="reference-editor" role="group" aria-label="Starting colour comparison">
            <button class="reference-field" type="button" aria-label="Choose surrounding colour"></button>
            <button class="reference-target" type="button" aria-label="Choose target colour"></button>
          </div>
          <div class="empty-result">Results update as you change the colours.</div>
        </div>
      </article>
    </section>
    <section class="controls" aria-label="ColourShift controls">
      <input id="target" class="colour-picker" type="color" value="#950000" aria-label="Target colour" />
      <input id="surround" class="colour-picker" type="color" value="#005ce7" aria-label="Surrounding colour" />
      <label class="separation" for="min-delta">
        <span>Minimum result separation <output id="min-delta-value" for="min-delta">10</output></span>
        <input id="min-delta" type="range" min="0" max="100" step="1" value="10" />
      </label>
    </section>
    <p class="paper-link"><a href="paper/">Read the technical write-up</a></p>
  </main>
  <script>
    if (window.location.protocol === "file:") document.querySelector("#file-warning").hidden = false;
  </script>
  <script type="module" src="shift/app.js?v=19"></script>
</body>
</html>
